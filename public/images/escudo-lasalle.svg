<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE074"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2F59"/>
      <stop offset="100%" stop-color="#0B172E"/>
    </linearGradient>
    <filter id="shieldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Escudo Base -->
  <path d="M 20,20 Q 100,5 180,20 L 180,120 Q 180,200 100,230 Q 20,200 20,120 Z" 
        fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="5" filter="url(#shieldShadow)"/>
  
  <!-- Borde interior -->
  <path d="M 28,27 Q 100,15 172,27 L 172,118 Q 172,192 100,220 Q 28,192 28,118 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- Estrella Lasallista (Signum Fidei) -->
  <g transform="translate(100, 95) scale(0.65)">
    <!-- Rayos de luz -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#FCE074" stroke-width="1" opacity="0.4"/>
    <!-- Estrella de 5 puntas -->
    <polygon points="0,-60 18,-18 60,-18 26,8 39,52 0,26 -39,52 -26,8 -60,-18 -18,-18" 
             fill="url(#goldGrad)" stroke="#6E480C" stroke-width="2"/>
    <polygon points="0,-60 0,26 39,52 26,8 60,-18 18,-18" fill="#FFF2A3" opacity="0.6"/>
  </g>
  
  <!-- Letras SJL -->
  <text x="100" y="165" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" 
        font-size="16" font-weight="bold" fill="url(#goldGrad)" letter-spacing="4">SAN JOSÉ</text>
  <text x="100" y="185" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" 
        font-size="14" font-weight="bold" fill="#FCE074" letter-spacing="3">LA SALLE</text>
  
  <!-- Lema / Año -->
  <text x="100" y="205" text-anchor="middle" font-family="'Inter', sans-serif" 
        font-size="9" fill="#D4AF37" letter-spacing="2">1967 • 1968 • 1969</text>
</svg>
