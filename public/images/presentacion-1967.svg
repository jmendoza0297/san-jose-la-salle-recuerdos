<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#2c2014"/>
  <rect x="25" y="25" width="750" height="450" fill="#523d2b"/>
  <!-- Patio de Honor y Formación Calisténica 1967 -->
  <line x1="25" y1="380" x2="775" y2="380" stroke="#38271a" stroke-width="3"/>
  <rect x="25" y="380" width="750" height="95" fill="#3a2a1c"/>

  <!-- Fachada neoclásica del colegio al fondo -->
  <rect x="150" y="80" width="500" height="150" fill="#2d1f14" opacity="0.6"/>
  <!-- Columnas y arcos -->
  <line x1="200" y1="90" x2="200" y2="230" stroke="#755940" stroke-width="8"/>
  <line x1="300" y1="90" x2="300" y2="230" stroke="#755940" stroke-width="8"/>
  <line x1="400" y1="90" x2="400" y2="230" stroke="#755940" stroke-width="8"/>
  <line x1="500" y1="90" x2="500" y2="230" stroke="#755940" stroke-width="8"/>
  <line x1="600" y1="90" x2="600" y2="230" stroke="#755940" stroke-width="8"/>

  <!-- Filas geométricas de alumnos de blanco haciendo calistenia sincronizada -->
  <g fill="#f2e2cb" opacity="0.9">
    <!-- Fila 1 -->
    <g transform="translate(180, 240)">
      <circle cx="0" cy="0" r="10"/><line x1="0" y1="10" x2="0" y2="50" stroke="#f2e2cb" stroke-width="8"/>
      <line x1="0" y1="20" x2="-25" y2="5" stroke="#f2e2cb" stroke-width="4"/><line x1="0" y1="20" x2="25" y2="5" stroke="#f2e2cb" stroke-width="4"/>
    </g>
    <g transform="translate(280, 240)">
      <circle cx="0" cy="0" r="10"/><line x1="0" y1="10" x2="0" y2="50" stroke="#f2e2cb" stroke-width="8"/>
      <line x1="0" y1="20" x2="-25" y2="5" stroke="#f2e2cb" stroke-width="4"/><line x1="0" y1="20" x2="25" y2="5" stroke="#f2e2cb" stroke-width="4"/>
    </g>
    <g transform="translate(380, 240)">
      <circle cx="0" cy="0" r="10"/><line x1="0" y1="10" x2="0" y2="50" stroke="#f2e2cb" stroke-width="8"/>
      <line x1="0" y1="20" x2="-25" y2="5" stroke="#f2e2cb" stroke-width="4"/><line x1="0" y1="20" x2="25" y2="5" stroke="#f2e2cb" stroke-width="4"/>
    </g>
    <g transform="translate(480, 240)">
      <circle cx="0" cy="0" r="10"/><line x1="0" y1="10" x2="0" y2="50" stroke="#f2e2cb" stroke-width="8"/>
      <line x1="0" y1="20" x2="-25" y2="5" stroke="#f2e2cb" stroke-width="4"/><line x1="0" y1="20" x2="25" y2="5" stroke="#f2e2cb" stroke-width="4"/>
    </g>
    <g transform="translate(580, 240)">
      <circle cx="0" cy="0" r="10"/><line x1="0" y1="10" x2="0" y2="50" stroke="#f2e2cb" stroke-width="8"/>
      <line x1="0" y1="20" x2="-25" y2="5" stroke="#f2e2cb" stroke-width="4"/><line x1="0" y1="20" x2="25" y2="5" stroke="#f2e2cb" stroke-width="4"/>
    </g>

    <!-- Fila frontal más grande -->
    <g transform="translate(230, 310)">
      <circle cx="0" cy="0" r="13"/><line x1="0" y1="13" x2="0" y2="65" stroke="#f2e2cb" stroke-width="10"/>
      <line x1="0" y1="25" x2="-35" y2="5" stroke="#f2e2cb" stroke-width="5"/><line x1="0" y1="25" x2="35" y2="5" stroke="#f2e2cb" stroke-width="5"/>
    </g>
    <g transform="translate(350, 310)">
      <circle cx="0" cy="0" r="13"/><line x1="0" y1="13" x2="0" y2="65" stroke="#f2e2cb" stroke-width="10"/>
      <line x1="0" y1="25" x2="-35" y2="5" stroke="#f2e2cb" stroke-width="5"/><line x1="0" y1="25" x2="35" y2="5" stroke="#f2e2cb" stroke-width="5"/>
    </g>
    <g transform="translate(470, 310)">
      <circle cx="0" cy="0" r="13"/><line x1="0" y1="13" x2="0" y2="65" stroke="#f2e2cb" stroke-width="10"/>
      <line x1="0" y1="25" x2="-35" y2="5" stroke="#f2e2cb" stroke-width="5"/><line x1="0" y1="25" x2="35" y2="5" stroke="#f2e2cb" stroke-width="5"/>
    </g>
  </g>
  <text x="50" y="465" fill="#d8bc9b" opacity="0.8" font-family="'Courier New', monospace" font-size="13">ARCHIVO HISTÓRICO SJL • PRESENTACIÓN GIMNÁSTICA COLEGIAL 1967 • № 1967-P02</text>
</svg>
