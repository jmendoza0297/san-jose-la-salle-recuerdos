<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#2c2014"/>
  <rect x="25" y="25" width="750" height="450" fill="#423122"/>
  
  <!-- Gradas con multitud y banderas de San Jose La Salle -->
  <polygon points="25,475 775,475 775,220 25,280" fill="#271b12"/>
  <polygon points="25,475 775,475 775,320 25,380" fill="#1b120c"/>

  <!-- Banderas ondeando y papel picado -->
  <g fill="#ecd8c1" opacity="0.9">
    <path d="M 120,180 Q 180,150 240,180 L 240,240 Q 180,210 120,240 Z" fill="#1a335c"/>
    <text x="180" y="215" fill="#ffd464" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="bold" text-anchor="middle">SJL</text>

    <path d="M 520,160 Q 600,130 680,160 L 680,230 Q 600,200 520,230 Z" fill="#fff5d9"/>
    <text x="600" y="198" fill="#1a335c" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="bold" text-anchor="middle">1968</text>

    <!-- Siluetas de hinchas saltando en tribuna -->
    <circle cx="160" cy="310" r="12"/><line x1="160" y1="322" x2="160" y2="390" stroke="#ecd8c1" stroke-width="8"/>
    <line x1="160" y1="335" x2="140" y2="300" stroke="#ecd8c1" stroke-width="4"/><line x1="160" y1="335" x2="180" y2="300" stroke="#ecd8c1" stroke-width="4"/>

    <circle cx="230" cy="290" r="12"/><line x1="230" y1="302" x2="230" y2="380" stroke="#ecd8c1" stroke-width="8"/>
    <line x1="230" y1="315" x2="210" y2="280" stroke="#ecd8c1" stroke-width="4"/><line x1="230" y1="315" x2="260" y2="260" stroke="#ecd8c1" stroke-width="4"/>

    <circle cx="310" cy="305" r="12"/><line x1="310" y1="317" x2="310" y2="385" stroke="#ecd8c1" stroke-width="8"/>
    <line x1="310" y1="325" x2="290" y2="285" stroke="#ecd8c1" stroke-width="4"/><line x1="310" y1="325" x2="330" y2="285" stroke="#ecd8c1" stroke-width="4"/>

    <circle cx="450" cy="300" r="12"/><line x1="450" y1="312" x2="450" y2="380" stroke="#ecd8c1" stroke-width="8"/>
    <line x1="450" y1="320" x2="430" y2="270" stroke="#ecd8c1" stroke-width="4"/><line x1="450" y1="320" x2="470" y2="270" stroke="#ecd8c1" stroke-width="4"/>
  </g>

  <!-- Papelillos cayendo -->
  <g fill="#ffe5b4" opacity="0.6">
    <rect x="180" y="100" width="8" height="4" transform="rotate(25 180 100)"/>
    <rect x="280" y="140" width="8" height="4" transform="rotate(-35 280 140)"/>
    <rect x="380" y="110" width="8" height="4" transform="rotate(45 380 110)"/>
    <rect x="490" y="130" width="8" height="4" transform="rotate(15 490 130)"/>
    <rect x="620" y="90" width="8" height="4" transform="rotate(-50 620 90)"/>
  </g>

  <text x="50" y="465" fill="#d8bc9b" opacity="0.8" font-family="'Courier New', monospace" font-size="13">ARCHIVO HISTÓRICO SJL • TRIBUNA Y BARRA ALBIAZUL 1968 • № 1968-V04</text>
</svg>
