<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#2c2014"/>
  <rect x="25" y="25" width="750" height="450" fill="#4d3826"/>
  <!-- Celebración del Tricampeonato 1969 -->
  <polygon points="400,30 250,500 550,500" fill="#ffe6b0" opacity="0.15"/>
  
  <!-- Copa dorada levantada en hombros -->
  <g fill="#ecd8c1" opacity="0.95">
    <!-- Compañero cargado en hombros -->
    <circle cx="400" cy="180" r="16"/>
    <path d="M 380,200 L 420,200 L 415,260 L 385,260 Z"/>
    
    <!-- Brazos sosteniendo la gran copa -->
    <path d="M 370,120 L 430,120 L 420,165 L 380,165 Z" fill="#ffd464"/>
    <ellipse cx="400" cy="120" rx="30" ry="10" fill="#f5c040"/>
    <path d="M 390,165 L 410,165 L 415,190 L 385,190 Z" fill="#ffd464"/>
    <rect x="380" y="190" width="40" height="12" fill="#d49b28"/>

    <!-- Compañeros que lo cargan -->
    <circle cx="360" cy="270" r="14"/>
    <path d="M 345,286 L 375,286 L 370,380 L 350,380 Z"/>

    <circle cx="440" cy="270" r="14"/>
    <path d="M 425,286 L 455,286 L 450,380 L 430,380 Z"/>

    <!-- Compañeros alrededor festejando con banderas -->
    <circle cx="280" cy="290" r="13"/>
    <path d="M 268,305 L 292,305 L 290,390 L 270,390 Z"/>
    <line x1="280" y1="305" x2="250" y2="230" stroke="#ecd8c1" stroke-width="4"/>
    <polygon points="250,230 200,240 250,265" fill="#fce5b2"/>

    <circle cx="520" cy="290" r="13"/>
    <path d="M 508,305 L 532,305 L 530,390 L 510,390 Z"/>
    <line x1="520" y1="305" x2="550" y2="230" stroke="#ecd8c1" stroke-width="4"/>
    <polygon points="550,230 600,240 550,265" fill="#1b3d73"/>
  </g>
  <text x="50" y="465" fill="#d8bc9b" opacity="0.8" font-family="'Courier New', monospace" font-size="13">ARCHIVO HISTÓRICO SJL • VUELTA OLÍMPICA DEL TRICAMPEONATO 1969 • № 1969-F03</text>
</svg>
