<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <rect width="600" height="800" fill="#2c2014"/>
  <rect x="25" y="25" width="550" height="750" fill="#4d3928"/>
  
  <!-- Pirámide Humana 1968 - Fotografía vertical histórica -->
  <line x1="25" y1="680" x2="575" y2="680" stroke="#362518" stroke-width="4"/>
  <rect x="25" y="680" width="550" height="95" fill="#312215"/>

  <!-- Alumnos formando los niveles de la pirámide -->
  <g fill="#f0dfca" opacity="0.95">
    <!-- Nivel 1 (Base - 5 alumnos) -->
    <g transform="translate(140, 600)"><circle cx="0" cy="0" r="14"/><rect x="-12" y="14" width="24" height="60"/></g>
    <g transform="translate(220, 600)"><circle cx="0" cy="0" r="14"/><rect x="-12" y="14" width="24" height="60"/></g>
    <g transform="translate(300, 600)"><circle cx="0" cy="0" r="14"/><rect x="-12" y="14" width="24" height="60"/></g>
    <g transform="translate(380, 600)"><circle cx="0" cy="0" r="14"/><rect x="-12" y="14" width="24" height="60"/></g>
    <g transform="translate(460, 600)"><circle cx="0" cy="0" r="14"/><rect x="-12" y="14" width="24" height="60"/></g>

    <!-- Nivel 2 (4 alumnos) -->
    <g transform="translate(180, 500)"><circle cx="0" cy="0" r="14"/><rect x="-12" y="14" width="24" height="55"/></g>
    <g transform="translate(260, 500)"><circle cx="0" cy="0" r="14"/><rect x="-12" y="14" width="24" height="55"/></g>
    <g transform="translate(340, 500)"><circle cx="0" cy="0" r="14"/><rect x="-12" y="14" width="24" height="55"/></g>
    <g transform="translate(420, 500)"><circle cx="0" cy="0" r="14"/><rect x="-12" y="14" width="24" height="55"/></g>

    <!-- Nivel 3 (3 alumnos) -->
    <g transform="translate(220, 400)"><circle cx="0" cy="0" r="13"/><rect x="-11" y="13" width="22" height="50"/></g>
    <g transform="translate(300, 400)"><circle cx="0" cy="0" r="13"/><rect x="-11" y="13" width="22" height="50"/></g>
    <g transform="translate(380, 400)"><circle cx="0" cy="0" r="13"/><rect x="-11" y="13" width="22" height="50"/></g>

    <!-- Nivel 4 (2 alumnos) -->
    <g transform="translate(260, 310)"><circle cx="0" cy="0" r="12"/><rect x="-10" y="12" width="20" height="45"/></g>
    <g transform="translate(340, 310)"><circle cx="0" cy="0" r="12"/><rect x="-10" y="12" width="20" height="45"/></g>

    <!-- Nivel 5 (Cúspide - 1 alumno con la bandera de La Salle) -->
    <g transform="translate(300, 220)">
      <circle cx="0" cy="0" r="13"/>
      <rect x="-10" y="13" width="20" height="45"/>
      <!-- Brazo derecho levantado ondeando bandera -->
      <line x1="10" y1="20" x2="45" y2="-30" stroke="#f0dfca" stroke-width="4"/>
      <!-- Bandera ondeante albiazul con estrella dorada -->
      <path d="M 45,-30 Q 90,-50 130,-30 L 130,10 Q 90,-10 45,10 Z" fill="#1b335c"/>
      <polygon points="85,-20 89,-12 98,-12 91,-7 94,1 85,-4 76,1 79,-7 72,-12 81,-12" fill="#fed65e"/>
    </g>
  </g>

  <text x="50" y="745" fill="#d8bc9b" opacity="0.8" font-family="'Courier New', monospace" font-size="12">ARCHIVO HISTÓRICO SJL • PIRÁMIDE HUMANA DE 5 PISOS 1968 • № 1968-P05</text>
</svg>
