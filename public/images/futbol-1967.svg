<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#2c2014"/>
  <rect x="25" y="25" width="750" height="450" fill="#5c4530"/>
  <!-- Charla técnica y camerino vintage 1967 -->
  <line x1="25" y1="360" x2="775" y2="360" stroke="#3b2b1d" stroke-width="4"/>
  <!-- Pizarra de madera táctica con tiza -->
  <rect x="100" y="80" width="220" height="150" fill="#243026" stroke="#543d2b" stroke-width="8"/>
  <text x="210" y="115" text-anchor="middle" fill="#d9eed9" font-family="'Courier New', monospace" font-size="14">SAN JOSÉ LA SALLE</text>
  <text x="210" y="140" text-anchor="middle" fill="#d9eed9" font-family="'Courier New', monospace" font-size="12">FINAL '67: 4-3-3</text>
  <circle cx="160" cy="180" r="8" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="160" y="184" text-anchor="middle" fill="#fff" font-size="9">7</text>
  <circle cx="210" cy="175" r="8" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="210" y="179" text-anchor="middle" fill="#fff" font-size="9">9</text>
  <circle cx="260" cy="180" r="8" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="260" y="184" text-anchor="middle" fill="#fff" font-size="9">11</text>

  <!-- Siluetas atentos en el banquillo -->
  <g fill="#ecd8c1" opacity="0.9">
    <!-- Director Técnico explicando -->
    <circle cx="390" cy="180" r="16"/>
    <path d="M 370,200 L 410,200 L 405,340 L 375,340 Z"/>
    <line x1="410" y1="210" x2="445" y2="190" stroke="#ecd8c1" stroke-width="4"/>

    <!-- Jugadores sentados en bancas de madera -->
    <circle cx="480" cy="220" r="13"/>
    <rect x="470" y="235" width="20" height="90"/>

    <circle cx="530" cy="220" r="13"/>
    <rect x="520" y="235" width="20" height="90"/>

    <circle cx="580" cy="220" r="13"/>
    <rect x="570" y="235" width="20" height="90"/>

    <circle cx="630" cy="220" r="13"/>
    <rect x="620" y="235" width="20" height="90"/>
  </g>
  <text x="50" y="465" fill="#d8bc9b" opacity="0.8" font-family="'Courier New', monospace" font-size="13">ARCHIVO HISTÓRICO SJL • CAMERINO Y CHARLA TÉCNICA 1967 • ROLLO № 1967-C03</text>
</svg>
