<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <rect width="600" height="800" fill="#2c2014"/>
  <rect x="25" y="25" width="550" height="750" fill="#4a3625"/>

  <!-- Salón de Actos Máximo y Podio del Trofeo -->
  <line x1="25" y1="650" x2="575" y2="650" stroke="#352417" stroke-width="4"/>
  <rect x="25" y="650" width="550" height="125" fill="#301f12"/>

  <!-- Cortinajes de terciopelo de teatro clásico -->
  <path d="M 25,25 Q 150,180 25,350 L 25,25 Z" fill="#23130d"/>
  <path d="M 575,25 Q 450,180 575,350 L 575,25 Z" fill="#23130d"/>
  <path d="M 25,25 Q 300,120 575,25 L 575,70 Q 300,160 25,70 Z" fill="#1d100b"/>

  <!-- Gran Trofeo de Oro al centro sobre mesa con mantel con escudo -->
  <rect x="200" y="440" width="200" height="210" fill="#1e2c45" stroke="#ba9738" stroke-width="3"/>
  <circle cx="300" cy="545" r="30" fill="none" stroke="#ba9738" stroke-width="2"/>
  <polygon points="300,525 306,539 321,539 309,548 313,562 300,553 287,562 291,548 279,539 294,539" fill="#ba9738"/>

  <!-- Trofeo histórico -->
  <g transform="translate(300, 310)">
    <path d="M -50,-80 L 50,-80 L 35,0 Q 20,40 0,45 Q -20,40 -35,0 Z" fill="#ffd464" stroke="#a37618" stroke-width="3"/>
    <ellipse cx="0" cy="-80" rx="50" ry="12" fill="#ffe085"/>
    <path d="M -15,45 L 15,45 L 18,90 L -18,90 Z" fill="#ffd464"/>
    <rect x="-40" y="90" width="80" height="40" fill="#26170d" stroke="#a37618" stroke-width="2"/>
    <rect x="-30" y="100" width="60" height="20" fill="#ffd464"/>
    <text x="0" y="114" fill="#26170d" font-family="'Cinzel', Georgia, serif" font-size="9" font-weight="bold" text-anchor="middle">1967-1969</text>
  </g>

  <!-- Siluetas del Capitán y el Hermano Rector a los lados -->
  <g fill="#ecd8c1" opacity="0.95">
    <!-- Hermano Rector a la izquierda -->
    <circle cx="150" cy="350" r="18"/>
    <path d="M 130,375 L 170,375 L 175,650 L 125,650 Z" fill="#1b120c"/>
    <polygon points="144,375 156,375 154,410 146,410" fill="#fcf6e6"/>

    <!-- Capitán a la derecha con chaqueta de gala de la promoción -->
    <circle cx="450" cy="350" r="18"/>
    <path d="M 430,375 L 470,375 L 475,650 L 425,650 Z" fill="#2b3b57"/>
    <line x1="450" y1="375" x2="450" y2="450" stroke="#fcf6e6" stroke-width="4"/>
  </g>

  <text x="50" y="745" fill="#d8bc9b" opacity="0.8" font-family="'Courier New', monospace" font-size="12">ARCHIVO HISTÓRICO SJL • PREMIACIÓN Y CLAUSURA 1969 • № 1969-C10</text>
</svg>
