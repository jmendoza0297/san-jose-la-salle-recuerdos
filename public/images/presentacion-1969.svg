<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#2c2014"/>
  <rect x="25" y="25" width="750" height="450" fill="#4d3826"/>
  <!-- Banda de Guerra y Clarines 1969 -->
  <line x1="25" y1="360" x2="775" y2="360" stroke="#372619" stroke-width="3"/>
  <rect x="25" y="360" width="750" height="115" fill="#322215"/>

  <!-- Alumnos con quepis militar de gala colegial y tambores -->
  <g fill="#f1e0cc" opacity="0.95">
    <!-- Tamborilero 1 -->
    <g transform="translate(180, 240)">
      <polygon points="-12,-15 12,-15 10,-24 -10,-24" fill="#1b2841"/> <!-- Quepis -->
      <circle cx="0" cy="0" r="14"/>
      <rect x="-12" y="14" width="24" height="65"/>
      <!-- Tambor redoblante -->
      <ellipse cx="0" cy="55" rx="20" ry="10" fill="#edd6b4" stroke="#48321e" stroke-width="2"/>
      <rect x="-20" y="55" width="40" height="25" fill="#1b2841" stroke="#48321e" stroke-width="2"/>
      <ellipse cx="0" cy="80" rx="20" ry="10" fill="#c49b6b" stroke="#48321e" stroke-width="2"/>
    </g>

    <!-- Tamborilero 2 -->
    <g transform="translate(290, 240)">
      <polygon points="-12,-15 12,-15 10,-24 -10,-24" fill="#1b2841"/>
      <circle cx="0" cy="0" r="14"/>
      <rect x="-12" y="14" width="24" height="65"/>
      <ellipse cx="0" cy="55" rx="20" ry="10" fill="#edd6b4" stroke="#48321e" stroke-width="2"/>
      <rect x="-20" y="55" width="40" height="25" fill="#1b2841" stroke="#48321e" stroke-width="2"/>
      <ellipse cx="0" cy="80" rx="20" ry="10" fill="#c49b6b" stroke="#48321e" stroke-width="2"/>
    </g>

    <!-- Clarinero 1 -->
    <g transform="translate(420, 235)">
      <polygon points="-12,-15 12,-15 10,-24 -10,-24" fill="#1b2841"/>
      <circle cx="0" cy="0" r="14"/>
      <rect x="-12" y="14" width="24" height="70"/>
      <!-- Clarín dorado apuntando hacia el cielo -->
      <line x1="8" y1="2" x2="55" y2="-20" stroke="#ffd15c" stroke-width="4"/>
      <polygon points="55,-28 70,-15 50,-12" fill="#ffd15c"/>
    </g>

    <!-- Clarinero 2 -->
    <g transform="translate(530, 235)">
      <polygon points="-12,-15 12,-15 10,-24 -10,-24" fill="#1b2841"/>
      <circle cx="0" cy="0" r="14"/>
      <rect x="-12" y="14" width="24" height="70"/>
      <!-- Clarín dorado -->
      <line x1="8" y1="2" x2="55" y2="-20" stroke="#ffd15c" stroke-width="4"/>
      <polygon points="55,-28 70,-15 50,-12" fill="#ffd15c"/>
    </g>

    <!-- Bastonero Mayor con boina y bastón de mando con pompón -->
    <g transform="translate(640, 220)">
      <polygon points="-14,-16 14,-16 12,-28 -12,-28" fill="#d4af37"/>
      <circle cx="0" cy="0" r="15"/>
      <rect x="-14" y="15" width="28" height="85"/>
      <line x1="18" y1="10" x2="35" y2="-45" stroke="#f2f2f2" stroke-width="4"/>
      <circle cx="37" cy="-48" r="8" fill="#ffd15c"/>
    </g>
  </g>

  <text x="50" y="465" fill="#d8bc9b" opacity="0.8" font-family="'Courier New', monospace" font-size="13">ARCHIVO HISTÓRICO SJL • BANDA DE GUERRA Y CLARINES 1969 • № 1969-P09</text>
</svg>
